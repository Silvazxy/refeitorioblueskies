<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Blue Skies - Confirmado</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="header-container">
      <img src="img/logo.png" alt="Blue Skies Logo" class="logo-header">
      <div class="header-texto">
        <h1>BLUE SKIES</h1>
      </div>
    </div>
  </header>

  <main>
    <div class="sucesso-container">
      <div class="icone-sucesso">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
      <h2>Tudo Certo!</h2>
      <p class="sucesso-mensagem">Sua refeição foi agendada com sucesso.</p>
      
      <div class="sucesso-timer">
        <div class="barra-progresso"></div>
      </div>
      <p class="sucesso-rodape">Redirecionando para o início...</p>
    </div>
  </main>

  <footer>
    <p>Blue Skies Exportação de Frutas &copy; 2026</p>
  </footer>

  <script>
    setTimeout(() => {
      window.location.href = 'index.html';
    }, 3000);
  </script>
</body>
</html>
